name: probe
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: 数据源可用性探测
        run: |
          echo "===== 1. Binance 官方历史数据站 data.binance.vision ====="
          curl -s -o /dev/null -w "  daily klines zip: HTTP %{http_code}  size=%{size_download}B  %{time_total}s\n" \
            --max-time 25 "https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/5m/BTCUSDT-5m-2026-11-11.zip"
          curl -s -o /dev/null -w "  月线 monthly:     HTTP %{http_code}  size=%{size_download}B\n" \
            --max-time 25 "https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/5m/BTCUSDT-5m-2026-09.zip"
          curl -s -o /dev/null -w "  spot daily:       HTTP %{http_code}  size=%{size_download}B\n" \
            --max-time 25 "https://data.binance.vision/data/spot/daily/klines/BTCUSDT/5m/BTCUSDT-5m-2026-11-11.zip"

          echo ""
          echo "===== 2. Binance API（已知被 451）====="
          curl -s -o /dev/null -w "  fapi: HTTP %{http_code}\n" --max-time 15 https://fapi.binance.com/fapi/v1/ping
          curl -s -o /dev/null -w "  api(spot): HTTP %{http_code}\n" --max-time 15 https://api.binance.com/api/v3/ping
          curl -s -o /dev/null -w "  api1: HTTP %{http_code}\n" --max-time 15 https://api1.binance.com/api/v3/ping
          curl -s -o /dev/null -w "  api2: HTTP %{http_code}\n" --max-time 15 https://api2.binance.com/api/v3/ping

          echo ""
          echo "===== 3. OKX ====="
          curl -s --max-time 20 "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT&bar=5m&limit=2" -o /tmp/okx.json -w "  OKX candles: HTTP %{http_code} " 
          head -c 120 /tmp/okx.json; echo ""

          echo ""
          echo "===== 4. Bybit ====="
          curl -s --max-time 20 "https://api.bybit.com/v5/market/kline?category=linear&symbol=BTCUSDT&interval=5&limit=2" -o /tmp/bybit.json -w "  Bybit kline: HTTP %{http_code} "
          head -c 120 /tmp/bybit.json; echo ""

          echo ""
          echo "===== 5. Coinbase ==="
          curl -s --max-time 20 "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=300" -o /tmp/cb.json -w "  Coinbase: HTTP %{http_code} "
          head -c 120 /tmp/cb.json; echo ""

          echo ""
          echo "===== 6. KuCoin ====="
          curl -s --max-time 20 "https://api.kucoin.com/api/v1/market/candles?type=5min&symbol=BTC-USDT&startAt=$(date -d '-1 hour' +%s)" -o /tmp/kc.json -w "  KuCoin: HTTP %{http_code} "
          head -c 120 /tmp/kc.json; echo ""

          echo ""
          echo "===== 7. Gate.io ====="
          curl -s --max-time 20 "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=BTC_USDT&interval=5m&limit=2" -o /tmp/gate.json -w "  Gate: HTTP %{http_code} "
          head -c 120 /tmp/gate.json; echo ""

          echo ""
          echo "===== 8. runner 出网 IP / 位置 ====="
          curl -s --max-time 15 https://ipinfo.io/json | head -c 300; echo ""
